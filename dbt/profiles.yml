ecommerce_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      extensions:
        - httpfs
        - delta
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD', 'minioadmin') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
          use_ssl: false
          url_style: path
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minioadmin') }}"
        s3_use_ssl: false
        s3_url_style: path
