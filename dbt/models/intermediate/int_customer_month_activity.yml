version: 2

models:
  - name: int_customer_month_activity
    description: "Customer-month activity grid generated by cross-joining each customer (from cohort month onward) to calendar months and joining purchase counts."
    columns:
      - name: customer_key
        description: "FK to dim_customer"
        tests:
          - not_null

      - name: cohort_month
        description: "Month of first purchase"
        tests:
          - not_null

      - name: activity_month
        description: "Calendar month evaluated"
        tests:
          - not_null

      - name: months_since_first_purchase
        description: "Month offset (0 for cohort month, 1 for next month, etc.)"
        tests:
          - not_null

      - name: made_purchase
        description: "Boolean flag indicating if customer purchased in activity_month"
        tests:
          - not_null
